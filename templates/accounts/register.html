{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2>Criar conta</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn-primary" type="submit">Cadastrar</button>
    </form>

    <p>
        Já possui conta?
        <a href="{% url 'login' %}">Entrar</a>
    </p>
</div>
{% endblock %}
