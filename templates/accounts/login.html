{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2>Entrar</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn-primary" type="submit">Entrar</button>
    </form>

    <p>
        Ainda não possui conta?
        <a href="{% url 'register' %}">Cadastrar</a>
    </p>
</div>
{% endblock %}
